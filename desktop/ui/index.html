<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aiKu Dynamic Island</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage">
      <div class="notch-wrapper">
        <!-- Left Concave Top Bezel Ear -->
        <svg class="notch-ear ear-left" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
          <path d="M14,0 L0,0 A14,14 0 0,1 14,14 Z" fill="#000000" />
        </svg>

        <!-- Dynamic Island Pure Black Shell -->
        <div id="island" class="island state-idle" data-state="idle">
          <!-- ========================================
               STATE 1: IDLE PILL (~198 x 34px)
               ======================================== -->
          <div id="view-idle" class="view view-idle" role="button" tabindex="0" title="Klik untuk membuka aiKu">
            <div class="idle-left">
              <span class="status-dot dot-emerald pulse"></span>
              <svg class="icon-xs text-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="4" y="6" width="16" height="12" rx="3" />
                <circle cx="9" cy="12" r="1.2" fill="currentColor" />
                <circle cx="15" cy="12" r="1.2" fill="currentColor" />
                <path d="M12 2v4" />
              </svg>
              <span id="idle-label" class="idle-label">AI Ready</span>
            </div>
            <div class="idle-right">
              <span id="idle-file-count" class="new-pill mono">0 file</span>
              <button id="btn-idle-mic" type="button" class="icon-btn-tiny" title="Input Suara">
                <svg class="icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="2" width="6" height="11" rx="3" />
                  <path d="M5 10a7 7 0 0 0 14 0M12 17v4" />
                </svg>
              </button>
            </div>
          </div>

          <!-- ========================================
               STATE 2: ACTIVE THINKING / VOICE (~380 x 62px)
               ======================================== -->
          <div id="view-active" class="view view-active">
            <div class="active-row">
              <div class="active-left">
                <div class="ai-orb"><span class="orb-core"></span></div>
                <div class="waveform" aria-hidden="true">
                  <span class="bar b1"></span>
                  <span class="bar b2"></span>
                  <span class="bar b3"></span>
                  <span class="bar b4"></span>
                  <span class="bar b5"></span>
                </div>
              </div>
              <div class="active-center">
                <div id="active-title" class="active-title">Memproses perintah...</div>
                <div id="active-subtitle" class="active-sub mono">Offline Local AI • Qwen 0.5B</div>
              </div>
              <button id="btn-active-stop" type="button" class="stop-btn" title="Kembali">
                <span class="stop-square"></span>
              </button>
            </div>
            <div class="notch-grabber"></div>
          </div>

          <!-- ========================================
               STATE 3: QUICK COMMAND & MICRO-ASSISTANT (~480px)
               ======================================== -->
          <div id="view-palette" class="view view-palette">
            <form id="palette-form" class="palette-input-bar">
              <svg class="icon-sm text-cyan" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 2l2.1 6.4L20.5 10.5l-6.4 2.1L12 19l-2.1-6.4-6.4-2.1 6.4-2.1L12 2z" />
              </svg>
              <input
                id="palette-input"
                type="text"
                placeholder="Ask AI, search files, or summarize clipboard."
                autocomplete="off"
              />
              <button id="btn-palette-mic" type="button" class="icon-btn-tiny" title="Input Suara">
                <svg class="icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="2" width="6" height="11" rx="3" />
                  <path d="M5 10a7 7 0 0 0 14 0M12 17v4" />
                </svg>
              </button>
              <button id="btn-open-security" type="button" class="icon-btn-tiny" title="Pengaturan & Rollback">
                <svg class="icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="3" />
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
              </button>
              <button id="btn-quit-app" type="button" class="icon-btn-tiny" title="Tutup aiKu">
                <svg class="icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M6 6l12 12M18 6L6 18" />
                </svg>
              </button>
            </form>

            <div class="palette-chips">
              <button id="chip-organize" type="button" class="island-chip">
                <svg class="icon-xs text-emerald" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                </svg>
                <span>Rapikan File</span>
              </button>

              <button id="chip-clipboard" type="button" class="island-chip">
                <svg class="icon-xs text-cyan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="2" width="6" height="4" rx="1" />
                  <path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2" />
                </svg>
                <span>Ringkas Clipboard</span>
              </button>

              <button id="chip-hygiene" type="button" class="island-chip">
                <svg class="icon-xs text-violet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="11" cy="11" r="7" />
                  <path d="M21 21l-4.35-4.35" />
                </svg>
                <span>Cek Duplikat</span>
              </button>

              <button id="chip-format-pdf" type="button" class="island-chip">
                <svg class="icon-xs text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 6h16M4 12h16M4 18h10" />
                </svg>
                <span>Rapikan PDF</span>
              </button>
            </div>

            <div id="palette-chat-stream" class="palette-chat-stream hidden"></div>

            <div id="handle-palette" class="notch-grabber clickable" title="Perkecil (Esc)"></div>
          </div>

          <!-- ========================================
               STATE 4: SAFE DRY-RUN PREVIEW (~620px)
               ======================================== -->
          <div id="view-inspector" class="view view-inspector">
            <div class="inspector-header">
              <div class="inspector-title-row">
                <span class="orb-mini"></span>
                <span id="inspector-title" class="inspector-heading">Safe Dry-Run Preview</span>
              </div>
              <div class="header-right-group">
                <span class="security-pill mono">
                  <span class="status-dot dot-emerald"></span>
                  <span>Offline • No Delete</span>
                </span>
                <button id="btn-inspector-gear" type="button" class="icon-btn-tiny" title="Security & Rollback">
                  <svg class="icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3" />
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="sandbox-subbar mono">
              <span id="inspector-sandbox" class="truncate">Sandbox: ...</span>
              <span id="inspector-meta" class="text-muted">0 files • Local AI</span>
            </div>

            <div id="inspector-list" class="inspector-list"></div>

            <div class="inspector-footer">
              <button id="btn-inspector-undo" type="button" class="pill-btn-muted mono">
                ↺ Undo (SHA-256)
              </button>
              <div class="inspector-actions">
                <button id="btn-inspector-cancel" type="button" class="btn-text">Cancel</button>
                <button id="btn-inspector-apply" type="button" class="btn-apply">Apply Changes</button>
              </div>
            </div>

            <div id="handle-inspector" class="notch-grabber clickable" title="Perkecil (Esc)"></div>
          </div>

          <!-- ========================================
               STATE 5: SECURITY & ROLLBACK (2 TABS, ~620px)
               ======================================== -->
          <div id="view-security" class="view view-security">
            <div class="inspector-header">
              <div class="inspector-title-row">
                <button id="btn-security-back" type="button" class="icon-btn-tiny" title="Kembali">
                  <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                  </svg>
                </button>
                <span class="inspector-heading">Security &amp; Rollback</span>
              </div>
              <span class="security-pill mono">
                <span class="status-dot dot-emerald"></span>
                <span>Strict Sandbox Active</span>
              </span>
            </div>

            <div class="segmented-tabs">
              <button id="seg-sandbox" type="button" class="seg-btn active">Sandbox &amp; Settings</button>
              <button id="seg-history" type="button" class="seg-btn">SHA-256 History</button>
            </div>

            <!-- Sub-tab A: Sandbox & Settings -->
            <form id="settings-form" class="subtab-panel active">
              <div id="settings-dirs-list" class="dir-chips"></div>
              <div class="add-dir-row">
                <input id="settings-new-dir" type="text" placeholder="Tambah folder aman (mis. D:\Kerja\Tes)" />
                <button id="btn-add-dir" type="button" class="island-chip">+ Add Folder</button>
                <button id="btn-open-sandbox" type="button" class="island-chip">Buka Folder</button>
              </div>

              <div class="field-grid-3">
                <div class="field-group">
                  <label class="field-label mono" for="settings-categories">Kategori AI</label>
                  <input id="settings-categories" type="text" required />
                </div>
                <div class="field-group">
                  <label class="field-label mono" for="settings-days">Installer (hari)</label>
                  <input id="settings-days" type="number" min="1" max="3650" value="30" required />
                </div>
                <div class="field-group">
                  <label class="field-label mono" for="settings-threads">CPU Threads</label>
                  <select id="settings-threads">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4" selected>4 (Max)</option>
                  </select>
                </div>
              </div>

              <div class="inspector-footer">
                <label class="mini-toggle mono">
                  <input type="checkbox" id="chk-ai-docs" />
                  <span>AI Smart Docs (.pdf/.docx/.txt)</span>
                </label>
                <button id="btn-settings-save" type="submit" class="btn-apply">Simpan Pengaturan</button>
              </div>
            </form>

            <!-- Sub-tab B: SHA-256 History -->
            <div id="history-panel" class="subtab-panel">
              <div id="history-list" class="inspector-list"></div>
            </div>

            <div id="handle-security" class="notch-grabber clickable" title="Perkecil (Esc)"></div>
          </div>
        </div>

        <!-- Right Concave Top Bezel Ear -->
        <svg class="notch-ear ear-right" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
          <path d="M0,0 L14,0 A14,14 0 0,0 0,14 Z" fill="#000000" />
        </svg>
      </div>

      <!-- Floating micro toast -->
      <div id="island-toast" class="island-toast hidden mono"></div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
