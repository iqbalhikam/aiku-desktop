<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aiKu — Obsidian Dynamic Island</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient-glow glow-violet"></div>
    <div class="ambient-glow glow-cyan"></div>
    <div class="ambient-glow glow-emerald"></div>

    <main class="stage">
      <!-- Dynamic Island Container (morphs between State 1, 2, 3, 4) -->
      <div id="island" class="island state-idle" data-state="idle">
        <!-- ========================================
             STATE 1: AMBIENT IDLE CAPSULE (220x40)
             ======================================== -->
        <div id="view-idle" class="view view-idle" role="button" tabindex="0" title="Klik atau tekan Alt+Space untuk membuka aiKu">
          <div class="idle-left">
            <span class="status-dot dot-emerald pulse"></span>
            <svg class="icon icon-spark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2L12 2z" />
            </svg>
            <span id="idle-label" class="idle-label">AI Ready</span>
          </div>
          <div class="idle-right">
            <span class="file-pill" title="Jumlah file di sandbox">
              <svg class="icon-xs text-emerald" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              </svg>
              <span id="idle-file-count" class="mono">0</span>
            </span>
            <button id="btn-idle-mic" type="button" class="icon-btn-subtle" title="Aktifkan Input Suara / AI">
              <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="2" width="6" height="11" rx="3" />
                <path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8" />
              </svg>
            </button>
          </div>
        </div>

        <!-- ========================================
             STATE 2: ACTIVE / THINKING / VOICE CAPSULE
             ======================================== -->
        <div id="view-active" class="view view-active">
          <div class="active-left">
            <div class="ai-orb"><span class="orb-core"></span></div>
            <div class="waveform" aria-hidden="true">
              <span class="bar b1"></span>
              <span class="bar b2"></span>
              <span class="bar b3"></span>
              <span class="bar b4"></span>
              <span class="bar b5"></span>
            </div>
          </div>
          <div class="active-center">
            <div id="active-title" class="active-title">"Menganalisis perintah..."</div>
            <div class="active-sub mono">
              <span class="status-dot dot-cyan pulse"></span>
              <span id="active-subtitle">Processing • Qwen2.5-0.5B Local</span>
            </div>
          </div>
          <button id="btn-active-stop" type="button" class="stop-btn" title="Kembali ke Palette">
            <span class="stop-square"></span>
          </button>
        </div>

        <!-- ========================================
             STATE 3: MICRO QUICK-ASSISTANT PALETTE + CHAT
             ======================================== -->
        <div id="view-palette" class="view view-palette">
          <form id="palette-form" class="palette-input-bar">
            <button id="btn-collapse-idle" type="button" class="icon-btn-cyan" title="Perkecil ke Capsule (Esc)">
              <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M15 18l-6-6 6-6" />
              </svg>
            </button>
            <input
              id="palette-input"
              type="text"
              placeholder="Ask AI... (mis. 'ada file apa aja sih' atau 'rapikan file')"
              autocomplete="off"
            />
            <button id="btn-palette-mic" type="button" class="icon-btn-subtle" title="Input Suara">
              <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="2" width="6" height="11" rx="3" />
                <path d="M5 10a7 7 0 0 0 14 0M12 17v5" />
              </svg>
            </button>
            <button id="btn-quit-app" type="button" class="icon-btn-subtle" title="Tutup aiKu">
              <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 6l12 12M18 6L6 18" />
              </svg>
            </button>
          </form>

          <div class="palette-chips">
            <button id="chip-organize" type="button" class="island-chip">
              <svg class="icon-xs text-emerald" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              </svg>
              <span>Organize Sandbox</span>
              <span id="chip-file-count" class="chip-meta mono">0 files</span>
            </button>

            <button id="chip-clipboard" type="button" class="island-chip">
              <svg class="icon-xs text-cyan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="2" width="6" height="4" rx="1" />
                <path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2" />
              </svg>
              <span>Summarize Clipboard</span>
            </button>

            <button id="chip-hygiene" type="button" class="island-chip">
              <svg class="icon-xs text-violet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7" />
                <path d="M21 21l-4.35-4.35" />
              </svg>
              <span>Find Duplicates &amp; Installers</span>
            </button>

            <button id="chip-history" type="button" class="island-chip">
              <svg class="icon-xs text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
                <path d="M3 3v5h5M12 7v5l3 2" />
              </svg>
              <span>SHA-256 Rollback</span>
            </button>
          </div>

          <div id="palette-chat-stream" class="palette-chat-stream hidden"></div>

          <div class="palette-footer mono">
            <span id="palette-sandbox-path" class="truncate">SANDBOX: ...</span>
            <span class="footer-right">
              <label class="mini-toggle" title="Gunakan Qwen2.5-0.5B untuk kategorisasi dokumen (.pdf/.docx/.txt)">
                <input type="checkbox" id="chk-ai-docs" />
                <span>AI Docs</span>
              </label>
              <span class="dot-sep">•</span>
              <span id="palette-model-status" class="text-emerald">OFFLINE READY</span>
            </span>
          </div>
        </div>

        <!-- ========================================
             STATE 4: SANDBOXED FILE OPERATION INSPECTOR
             ======================================== -->
        <div id="view-inspector" class="view view-inspector">
          <div class="inspector-header">
            <div class="inspector-title-group">
              <div class="shield-box">
                <svg class="icon-md text-emerald" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 3l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6l7-3z" />
                  <path d="M9 12l2 2 4-4" />
                </svg>
              </div>
              <div>
                <div class="inspector-heading-row">
                  <span id="inspector-title" class="inspector-heading">Safe Dry-Run Preview</span>
                  <span id="inspector-count-pill" class="staged-pill mono">0 STAGED</span>
                </div>
                <div id="inspector-sandbox" class="inspector-sub mono">TARGET SANDBOX: ...</div>
              </div>
            </div>
            <div class="security-pill mono">
              <span class="status-dot dot-emerald"></span>
              <span>OFFLINE • NO-DELETE MODE</span>
              <svg class="icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="5" y="11" width="14" height="10" rx="2" />
                <path d="M8 11V7a4 4 0 0 1 8 0v4" />
              </svg>
            </div>
          </div>

          <div id="inspector-list" class="inspector-list"></div>

          <div class="inspector-footer">
            <button id="btn-inspector-history" type="button" class="pill-btn-muted mono">
              <svg class="icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
                <path d="M3 3v5h5M12 7v5l3 2" />
              </svg>
              <span>Verify Last Rollback (SHA-256)</span>
            </button>
            <div class="inspector-actions">
              <button id="btn-inspector-dismiss" type="button" class="btn-text">Dismiss</button>
              <button id="btn-inspector-apply" type="button" class="btn-apply">
                <svg class="icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                  <path d="M20 6L9 17l-5-5" />
                </svg>
                <span id="btn-apply-label">Apply Changes</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Floating micro toast below the island -->
      <div id="island-toast" class="island-toast hidden mono"></div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
