<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aiku Live Wallpaper Graph</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #161619;
        color: #f4f4f5;
        font-family: "Segoe UI Variable Text", "Inter", system-ui, sans-serif;
        user-select: none;
      }
      #wallpaper-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
      }
      #wallpaper-canvas.grabbing {
        cursor: grabbing;
      }
      #wallpaper-canvas.hovering {
        cursor: pointer;
      }

      /* Minimalist Bottom-Right HUD */
      .hud {
        position: fixed;
        right: 26px;
        bottom: 58px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        pointer-events: none;
        opacity: 0.86;
      }
      .hud-card {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 7px 14px;
        border-radius: 999px;
        background: rgba(16, 16, 20, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        font-size: 11px;
        color: #a1a1aa;
      }
      .hud-brand {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #f4f4f5;
        font-weight: 600;
      }
      .hud-sep {
        width: 1px;
        height: 12px;
        background: rgba(255, 255, 255, 0.12);
      }
      .hud-src {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-family: "JetBrains Mono", Consolas, monospace;
        font-size: 10.5px;
      }
      .src-dot {
        width: 6.5px;
        height: 6.5px;
        border-radius: 999px;
      }
      .hud-insight {
        font-family: "JetBrains Mono", Consolas, monospace;
        font-size: 10px;
        color: #71717a;
        padding-right: 6px;
      }

      /* Interactive Controls (Bottom-Left) */
      .controls {
        position: fixed;
        left: 24px;
        bottom: 58px;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 4px;
        border-radius: 999px;
        background: rgba(16, 16, 20, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
      }
      .ctrl-btn {
        height: 26px;
        min-width: 26px;
        padding: 0 9px;
        border-radius: 999px;
        border: none;
        background: transparent;
        color: #a1a1aa;
        font-family: "JetBrains Mono", Consolas, monospace;
        font-size: 11px;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .ctrl-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #f4f4f5;
      }

      /* Interactive Node Inspector Card (muncul saat node diklik) */
      .node-card {
        position: fixed;
        left: 24px;
        top: 24px;
        width: 268px;
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(16, 16, 20, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.11);
        backdrop-filter: blur(14px);
        display: flex;
        flex-direction: column;
        gap: 8px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      }
      .node-card.hidden {
        display: none;
      }
      .node-card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .node-card-title {
        font-size: 13px;
        font-weight: 600;
        color: #f4f4f5;
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .node-card-meta {
        font-family: "JetBrains Mono", Consolas, monospace;
        font-size: 10px;
        color: #8b8b96;
      }
      .node-neighbors {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        max-height: 110px;
        overflow-y: auto;
      }
      .nb-chip {
        padding: 3px 8px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
        color: #d4d4d8;
        font-size: 10.5px;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .nb-chip:hover {
        background: rgba(255, 255, 255, 0.14);
        color: #ffffff;
      }

      /* Custom Node Modal Popover */
      .custom-modal {
        position: fixed;
        left: 24px;
        bottom: 98px;
        width: 286px;
        padding: 13px 14px;
        border-radius: 14px;
        background: rgba(16, 16, 20, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(14px);
        display: flex;
        flex-direction: column;
        gap: 9px;
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.52);
      }
      .custom-modal.hidden {
        display: none;
      }
      .cm-title {
        font-size: 12px;
        font-weight: 600;
        color: #f4f4f5;
      }
      .cm-input {
        width: 100%;
        padding: 7px 10px;
        border-radius: 9px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
        color: #f4f4f5;
        font-size: 11.5px;
        font-family: inherit;
        outline: none;
        user-select: text;
      }
      .cm-input:focus {
        border-color: rgba(255, 255, 255, 0.3);
      }
      .cm-colors {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .cm-swatch {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        border: 2px solid transparent;
        cursor: pointer;
        transition: transform 0.14s ease, border-color 0.14s ease;
      }
      .cm-swatch.active {
        border-color: #ffffff;
        transform: scale(1.15);
      }
      .cm-actions {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        margin-top: 2px;
      }
      .cm-btn-primary {
        padding: 5px 12px;
        border-radius: 8px;
        border: none;
        background: #f4f4f5;
        color: #09090b;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
      }
      .cm-btn-danger {
        padding: 4px 10px;
        border-radius: 8px;
        border: 1px solid rgba(224, 82, 82, 0.45);
        background: rgba(224, 82, 82, 0.14);
        color: #fca5a5;
        font-size: 10.5px;
        cursor: pointer;
        align-self: flex-start;
      }
    </style>
  </head>
  <body>
    <canvas id="wallpaper-canvas"></canvas>

    <!-- Node Inspector (muncul saat klik node) -->
    <div id="node-card" class="node-card hidden">
      <div class="node-card-head">
        <span class="node-card-title">
          <span id="nc-dot" class="src-dot"></span>
          <span id="nc-label">Konsep</span>
        </span>
        <button id="nc-close" type="button" class="ctrl-btn" title="Tutup">×</button>
      </div>
      <div id="nc-meta" class="node-card-meta"></div>
      <div id="nc-neighbors" class="node-neighbors"></div>
      <button id="nc-delete" type="button" class="cm-btn-danger hidden">Hapus Custom Node</button>
    </div>

    <!-- Custom Node Creator Popover -->
    <form id="custom-node-modal" class="custom-modal hidden">
      <div class="cm-title">Tambah Custom Node</div>
      <input id="cm-label" class="cm-input" type="text" maxlength="48" placeholder="Nama node (mis. Ide Startup, Skripsi)" required />
      <input id="cm-connect" class="cm-input" type="text" maxlength="160" placeholder="Hubungkan ke node (pisahkan koma, opsional)" />
      <input id="cm-note" class="cm-input" type="text" maxlength="200" placeholder="Catatan singkat (opsional)" />
      <div class="cm-colors" id="cm-colors">
        <button type="button" class="cm-swatch active" data-color="#E05252" style="background:#E05252" title="Coral"></button>
        <button type="button" class="cm-swatch" data-color="#5C6CF5" style="background:#5C6CF5" title="Indigo"></button>
        <button type="button" class="cm-swatch" data-color="#E5D96B" style="background:#E5D96B" title="Yellow"></button>
        <button type="button" class="cm-swatch" data-color="#52C99A" style="background:#52C99A" title="Mint"></button>
        <button type="button" class="cm-swatch" data-color="#C4C6CE" style="background:#C4C6CE" title="Silver"></button>
      </div>
      <div class="cm-actions">
        <button id="cm-cancel" type="button" class="ctrl-btn">Batal</button>
        <button type="submit" class="cm-btn-primary">Simpan Node</button>
      </div>
    </form>

    <!-- Interactive Zoom, Reset & Custom Node Controls -->
    <div class="controls">
      <button id="btn-zoom-in" type="button" class="ctrl-btn" title="Perbesar">+</button>
      <button id="btn-zoom-out" type="button" class="ctrl-btn" title="Perkecil">−</button>
      <button id="btn-reset-view" type="button" class="ctrl-btn" title="Reset posisi & zoom">Reset</button>
      <button id="btn-add-node" type="button" class="ctrl-btn" title="Tambah Custom Node baru">+ Node</button>
    </div>

    <!-- Minimalist Source Legend HUD -->
    <div class="hud">
      <div class="hud-card">
        <span class="hud-brand">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M13.5 11.2a3.8 3.8 0 1 0 0 5.6v-5.6ZM13.5 14v3.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M16.9 10.6a5.4 5.4 0 0 1 0 6.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity="0.82" />
            <path d="M19.5 8.4a8.4 8.4 0 0 1 0 11.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.45" />
          </svg>
          <span>aiku</span>
        </span>
        <span class="hud-sep"></span>
        <span class="hud-src"><span class="src-dot" style="background:#E05252"></span>Local <strong id="cnt-local">0</strong></span>
        <span class="hud-src"><span class="src-dot" style="background:#5C6CF5"></span>Antigravity <strong id="cnt-ag">0</strong></span>
        <span class="hud-src"><span class="src-dot" style="background:#E5D96B"></span>Gemini <strong id="cnt-gem">0</strong></span>
      </div>
      <div id="hud-insight" class="hud-insight">Scroll untuk zoom • Drag node untuk interaksi • Klik node untuk detail</div>
    </div>

    <script src="wallpaper.js"></script>
  </body>
</html>
