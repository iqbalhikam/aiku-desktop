[package]
name = "aiku-desktop"
version = "1.7.0"
description = "aiKu Desktop UI (Tauri v2 Rust Host + Node.js P0 Security Sidecar)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
